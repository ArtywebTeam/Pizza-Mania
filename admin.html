<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazioni | Area Amministrativa | Pizza Mania</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="theme-color" content="#0F0F0F">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

  <main class="admin-main">
    <div class="container">
      
      <!-- Top Navigation & Brand -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <a href="index.html" style="display: flex; align-items: center; gap: 0.75rem;">
          <img src="assets/images/logo.png" alt="Pizza Mania" style="width: 2.5rem; height: 2.5rem; border-radius: 9999px; background: white; padding: 2px;">
          <span style="font-weight: 900; font-size: 1.25rem; letter-spacing: -0.04em;">PIZZA <span style="color: var(--color-primary);">MANIA</span></span>
        </a>
        <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: rgba(255,255,255,0.7);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Torna al sito
        </a>
      </div>

      <!-- Header row with title & guests counter -->
      <div class="admin-header-row">
        <div>
          <p class="admin-tag">Command center</p>
          <h1 class="admin-title">Prenotazioni</h1>
        </div>

        <div class="admin-counter-badge">
          <span class="admin-counter-label">Ospiti oggi</span>
          <strong id="admin-today-guests" class="admin-counter-val">0</strong>
        </div>
      </div>

      <!-- Filters bar -->
      <div class="admin-filters-bar">
        <label class="admin-search-label">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="admin-search" placeholder="Cerca cliente o telefono..." style="width: 100%; outline: none; background: transparent;">
        </label>

        <input type="date" id="admin-date-filter" class="admin-input-date" style="outline: none;">
      </div>

      <!-- Reservations list -->
      <div id="admin-reservations-list" class="admin-reservations-grid"></div>

      <!-- Empty state -->
      <p id="admin-empty-state" style="display: none; padding: 4rem 0; text-align: center; opacity: 0.5;">
        Nessuna prenotazione trovata.
      </p>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/admin.js"></script>
</body>
</html>
